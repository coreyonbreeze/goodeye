<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GoodEye">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<title>GoodEye</title>
<style>
:root {
  color-scheme: dark;
  --bg: #111111; --surface-1: #1a1a19; --surface-2: #232322; --surface-3: #2e2e2c;
  --line: #34342f; --grid: #2b2b28;
  --text-primary: #f4f4f2; --text-secondary: #c3c2b7; --text-muted: #8d8c84;
  --accent: #3987e5;
  --ok: #2fa84f; --warn: #d9951e; --bad: #e25555; --pending: #8d8c84;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --mock-bg: #f3f2ef; --mock-card: #ffffff; --mock-ink: #1f1f1f; --mock-skel: #e3e2de;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #eeeeec; --surface-1: #fcfcfb; --surface-2: #f3f3f1; --surface-3: #e8e8e5;
    --line: #dcdbd6; --grid: #e6e5e0;
    --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #77766f;
    --accent: #2a78d6;
    --ok: #1e8a3c; --warn: #b87700; --bad: #c93b3b; --pending: #77766f;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text-primary); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
button, textarea { font: inherit; color: inherit; }
.app { display: grid; grid-template-columns: 300px minmax(0, 1fr) 390px; height: 100vh; }
@media (max-width: 1200px) { .app { grid-template-columns: 260px minmax(0, 1fr); } .side { grid-column: 2; } .app { height: auto; } }
#topbar, #scrim { display: none; }
.fit { width: 100%; overflow: hidden; }
.fit-in { width: max-content; transform-origin: top left; }
.qhead { display: flex; justify-content: space-between; align-items: center; margin: 0 0 10px; }
.qhead h1 { margin: 0 !important; }
.phonebtn { background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; font-size: 12px; cursor: pointer; color: var(--text-secondary); }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
.modal .box { background: var(--surface-1); border: 1px solid var(--line); border-radius: 12px; padding: 20px; max-width: 420px; width: 100%; text-align: center; }
.modal .box svg { width: 220px; height: 220px; border-radius: 8px; }
.modal code { background: var(--surface-2); padding: 2px 6px; border-radius: 4px; font-size: 13px; }
.modal .url { font-size: 11px; color: var(--text-muted); word-break: break-all; margin: 8px 0; }
button, .chip, .row, .opt, .sthumb { touch-action: manipulation; }

/* queue */
.queue { background: var(--surface-1); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.queue header { padding: 16px 16px 10px; }
.queue h1 { font-size: 15px; margin: 0 0 10px; letter-spacing: .01em; }
.seg { display: flex; gap: 2px; background: var(--surface-2); padding: 2px; border-radius: 8px; }
.seg button { flex: 1; border: 0; background: none; padding: 5px 4px; border-radius: 6px; font-size: 12px; color: var(--text-secondary); cursor: pointer; white-space: nowrap; }
.seg button.on { background: var(--surface-3); color: var(--text-primary); }
.seg .n { color: var(--text-muted); margin-left: 3px; }
.list { overflow-y: auto; padding: 4px 8px 16px; flex: 1; }
.row { display: grid; grid-template-columns: 64px 1fr; gap: 10px; padding: 8px; border-radius: 8px; cursor: pointer; align-items: center; }
.row:hover { background: var(--surface-2); }
.row.on { background: var(--surface-3); }
.thumb { width: 64px; height: 44px; border-radius: 5px; background: var(--surface-3) center/cover; overflow: hidden; }
.thumb img, .thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
.row .t { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .m { font-size: 12px; color: var(--text-muted); display: flex; gap: 8px; align-items: center; white-space: nowrap; overflow: hidden; }
.empty { color: var(--text-muted); padding: 24px 16px; font-size: 13px; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-secondary); }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--pending)); }
.st-approved, .st-picked { --c: var(--ok); } .st-not_chosen { --c: var(--line); } .st-changes { --c: var(--warn); } .st-rejected { --c: var(--bad); } .st-pending { --c: var(--accent); }

/* main */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.head { padding: 16px 20px 8px; }
.head h2 { margin: 0; font-size: 18px; }
.head .sub { color: var(--text-muted); font-size: 12px; margin-top: 2px; }
.bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 20px; }
.chip { border: 1px solid var(--line); background: var(--surface-1); padding: 4px 10px; border-radius: 999px; font-size: 12px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.chip.on { border-color: var(--accent); background: var(--surface-3); }
.chip .pill { font-size: 0; gap: 0; }
.bar .lbl { color: var(--text-muted); font-size: 12px; margin-right: 4px; }
.bar .gap { width: 14px; }
.toggle { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--text-secondary); cursor: pointer; user-select: none; }
.stage { flex: 1; min-height: 0; overflow: auto; padding: 16px 20px; display: flex; gap: 16px; justify-content: center; align-items: flex-start; }
.pane { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.pane .cap { font-size: 12px; color: var(--text-muted); }
.stage > .pane { align-self: stretch; min-height: 0; }
.stage > .pane:only-child > .raw, .stage > .pane > .cap + .raw { flex: 0 1 auto; min-height: 0; }
.raw { max-width: 100%; max-height: 100%; min-height: 0; object-fit: contain; display: block; border-radius: 6px; background: repeating-conic-gradient(#2a2a28 0 25%, #222220 0 50%) 0 0/16px 16px; }
.decide { border-top: 1px solid var(--line); background: var(--surface-1); padding: 12px 20px 14px; display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end; }
.decide textarea { width: 100%; min-height: 64px; max-height: 200px; resize: vertical; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; outline: none; }
.decide textarea:focus { border-color: var(--accent); }
.btns { display: flex; flex-direction: column; gap: 6px; }
.btn { border: 0; border-radius: 8px; padding: 8px 14px; font-weight: 600; cursor: pointer; display: flex; justify-content: space-between; gap: 14px; min-width: 190px; }
.btn kbd { font: 11px ui-monospace, monospace; opacity: .75; }
.btn.approve { background: var(--ok); color: #fff; }
.btn.changes { background: var(--warn); color: #111; }
.btn.reject { background: none; border: 1px solid var(--bad); color: var(--bad); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.note { grid-column: 1 / -1; font-size: 12px; color: var(--text-muted); }

/* side */
.side { background: var(--surface-1); border-left: 1px solid var(--line); overflow-y: auto; padding: 16px 18px 40px; }
.card { margin-bottom: 22px; }
.card h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); margin: 0 0 8px; font-weight: 600; }
.judge { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); }
.judge b { font-size: 13px; }
.judge ul { margin: 6px 0 0; padding-left: 18px; color: var(--text-secondary); font-size: 12px; }
.chart { position: relative; margin-bottom: 14px; }
.chart .ttl { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
.chart svg { display: block; width: 100%; overflow: visible; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
.legend i { display: inline-block; width: 12px; height: 2px; border-radius: 1px; vertical-align: middle; margin-right: 5px; }
.tip { position: absolute; pointer-events: none; background: var(--surface-3); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 12px; white-space: nowrap; z-index: 5; box-shadow: 0 4px 14px rgba(0,0,0,.3); }
.tip i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
table.delta { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
table.delta th { text-align: right; color: var(--text-muted); font-weight: 500; padding: 3px 4px; border-bottom: 1px solid var(--line); }
table.delta th:first-child, table.delta td:first-child { text-align: left; }
table.delta td { white-space: nowrap; text-align: right; padding: 4px; border-bottom: 1px solid var(--grid); }
.up { color: var(--ok); } .down { color: var(--bad); } .flat { color: var(--text-muted); }
.below { color: var(--bad); }
.r p { margin: 0 0 8px; color: var(--text-primary); }
.r ol { margin: 0; padding-left: 18px; }
.r li { margin-bottom: 8px; }
.r .why { color: var(--text-secondary); font-size: 13px; }
.r q { display: block; color: var(--text-muted); font-size: 12px; margin-top: 2px; font-style: italic; }
.r q::before { content: "Feedback: "; font-style: normal; }
.hist { list-style: none; margin: 0; padding: 0; }
.hist li { padding: 8px 0; border-bottom: 1px solid var(--grid); font-size: 13px; }
.hist .f { color: var(--text-secondary); margin-top: 3px; white-space: pre-wrap; }
.slothead { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); padding: 12px 8px 4px; display: flex; gap: 6px; }
.slothead b { color: var(--text-secondary); font-weight: 600; }
.row.inslot { margin-left: 10px; border-left: 2px solid var(--line); border-radius: 0 8px 8px 0; }
.slotbar { margin: 4px 20px 2px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-1); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.slotbar .info { font-size: 12px; color: var(--text-secondary); flex: 1 1 220px; }
.slotbar .info b { color: var(--text-primary); }
.sthumbs { display: flex; gap: 6px; flex-wrap: wrap; }
.sthumb { width: 76px; cursor: pointer; border: 2px solid transparent; border-radius: 6px; padding: 2px; font-size: 10px; color: var(--text-muted); }
.sthumb.on { border-color: var(--accent); }
.sthumb img, .sthumb video { width: 100%; height: 38px; object-fit: cover; border-radius: 4px; display: block; }
.sthumb .pill { font-size: 10px; }
.sthumb.closed img { opacity: .35; }
.filled { margin: 6px 20px 0; padding: 8px 12px; border-radius: 8px; background: var(--surface-2); font-size: 13px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.filled a { color: var(--text-primary); cursor: pointer; text-decoration: underline; }
.filled button, .confirm button.plain { background: var(--surface-3); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
.confirm { grid-column: 1 / -1; border: 1px solid var(--ok); border-radius: 10px; padding: 12px 14px; background: var(--surface-2); }
.confirm .q { font-size: 14px; margin-bottom: 8px; }
.confirm ul { list-style: none; margin: 6px 0 12px; padding: 0; display: flex; gap: 10px; flex-wrap: wrap; }
.confirm li { width: 120px; font-size: 11px; color: var(--text-secondary); }
.confirm li img { width: 100%; height: 60px; object-fit: cover; border-radius: 4px; display: block; opacity: .6; margin-bottom: 3px; }
.confirm .acts { display: flex; gap: 8px; }
.idle { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 40px 20px; text-align: center; overflow-y: auto; }
.idle h2 { margin: 14px 0 0; font-size: 22px; }
.idle p { margin: 0; color: var(--text-secondary); max-width: 420px; }
.idle .counts { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
.tiles { display: grid; grid-template-columns: repeat(3, 20px); gap: 6px; }
.tiles span { width: 20px; height: 20px; border-radius: 5px; background: var(--surface-3); animation: tile 3s ease-in-out infinite; animation-delay: calc(var(--i) * .18s); }
@keyframes tile { 0%, 55%, 100% { background: var(--surface-3); transform: scale(.82); } 20%, 35% { background: var(--c); transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .tiles span { animation: none; background: var(--c); opacity: .8; } }
.waitlist { width: 100%; max-width: 520px; margin-top: 22px; text-align: left; }
.waitlist h3, .recent h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); margin: 0 0 6px; font-weight: 600; }
.waitlist .row { grid-template-columns: 56px 1fr; }
.waitlist .thumb { width: 56px; height: 38px; }
.choice { width: 100%; }
.choice .q { font-size: 16px; font-weight: 600; margin: 0 0 4px; }
.choice .hint { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }
.opts { display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); gap: 12px; }
.opt { background: var(--surface-1); border: 2px solid var(--line); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 6px; position: relative; }
.opt.r1 { border-color: var(--ok); } .opt.r2 { border-color: var(--accent); } .opt.rn { border-color: var(--text-muted); }
.opt .omedia { cursor: pointer; border-radius: 6px; overflow: hidden; background: repeating-conic-gradient(#2a2a28 0 25%, #222220 0 50%) 0 0/16px 16px; }
.opt .omedia img, .opt .omedia video, .opt .omedia canvas { width: 100%; display: block; }
.opt .ohead { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; }
.opt .num { font: 11px ui-monospace, monospace; color: var(--text-muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.opt .rank { margin-left: auto; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--surface-3); }
.opt.r1 .rank { background: var(--ok); color: #fff; } .opt.r2 .rank { background: var(--accent); color: #fff; }
.opt .rec { font-size: 11px; color: var(--text-secondary); border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; }
.opt .anote { font-size: 12px; color: var(--text-secondary); }
.opt .osc { font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.opt input.onote { background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: inherit; font-size: 12px; color: inherit; outline: none; }
.opt input.onote:focus { border-color: var(--accent); }
.picks { font-size: 13px; margin-bottom: 6px; color: var(--text-secondary); }
.picks b { color: var(--text-primary); }
.btn .sub { display: block; font-weight: 400; font-size: 11px; opacity: .85; }
.btn .short { display: none; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--surface-3); border: 1px solid var(--line); padding: 10px 16px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }

/* mockups (always light, like the real sites) */
.mock { color: var(--mock-ink); font-size: 13px; }
.mock .skel { background: var(--mock-skel); border-radius: 4px; height: 9px; margin: 6px 0; }
.mock media-slot, .mock .media { display: block; width: 100%; }
.mock .media img, .mock .media video, .mock .media canvas { width: 100%; height: 100%; display: block; object-fit: cover; }
.pbar { display: flex; align-items: center; gap: 10px; padding: 8px 20px 10px; border-top: 1px solid var(--line); font-size: 12px; color: var(--text-secondary); font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.pbar[hidden] { display: none; }
.pbar button { background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; cursor: pointer; min-width: 30px; }
.pbar button:hover { background: var(--surface-3); }
.pbar .scrub { flex: 1 1 260px; min-width: 160px; accent-color: var(--accent); height: 18px; cursor: pointer; }
.pbar .time { color: var(--text-primary); min-width: 118px; }
.pbar .fileloop { color: var(--text-muted); flex-basis: 100%; }
.mk-page { background: var(--mock-bg); padding: 16px; border-radius: 10px; }
.mk-card { background: var(--mock-card); border-radius: 10px; overflow: hidden; border: 1px solid #dfdeda; }
.mk-hdr { display: flex; gap: 10px; align-items: center; padding: 12px; }
.mk-av { width: 40px; height: 40px; border-radius: 50%; background: #c9c7c1; flex: none; }
.mk-name { font-weight: 600; font-size: 13px; }
.mk-meta { color: #6b6a66; font-size: 11px; }
.phone { width: 360px; border-radius: 34px; border: 10px solid #0d0d0d; background: #fff; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
.browser { border-radius: 10px; overflow: hidden; background: #fff; box-shadow: 0 10px 40px rgba(0,0,0,.35); width: 100%; max-width: 980px; }
.chrome { background: #dedcd8; display: flex; align-items: center; gap: 8px; padding: 8px 12px; }
.dots { display: flex; gap: 6px; } .dots i { width: 11px; height: 11px; border-radius: 50%; background: #c2bfb9; }
.url { flex: 1; background: #fff; border-radius: 6px; height: 24px; }
.mock-note { font-size: 12px; color: var(--text-muted); max-width: 620px; text-align: center; }

/* ---------- phone ---------- */
@media (max-width: 760px) {
  html, body { height: auto; }
  body { padding-bottom: calc(var(--dh, 150px) + 8px); -webkit-text-size-adjust: 100%; }
  .app { display: block; height: auto; }
  #topbar { display: flex; position: sticky; top: 0; z-index: 30; align-items: center; gap: 12px; background: var(--surface-1); border-bottom: 1px solid var(--line);
    padding: calc(env(safe-area-inset-top) + 8px) 12px 8px; font-size: 15px; }
  #topbar button { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 15px; min-height: 40px; }
  #qcount:not(:empty) { background: var(--accent); color: #fff; border-radius: 999px; padding: 1px 7px; font-size: 12px; margin-left: 4px; }
  #qpos { margin-left: auto; color: var(--text-muted); font-size: 13px; }
  .queue { position: fixed; inset: 0 auto 0 0; width: min(86vw, 340px); z-index: 40; transform: translateX(-102%); transition: transform .22s ease;
    padding-top: env(safe-area-inset-top); box-shadow: 8px 0 30px rgba(0,0,0,.4); }
  body.qopen .queue { transform: none; }
  #scrim { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 35; }
  body.qopen #scrim { display: block; }
  .row { padding: 10px 8px; }
  .phonebtn { display: none; }
  .main { display: block; }
  .head { padding: 12px 14px 4px; }
  .head h2 { font-size: 17px; }
  .bar { flex-wrap: nowrap; overflow-x: auto; padding: 6px 14px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .bar::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 7px 12px; font-size: 13px; }
  .bar [data-cols] { display: none; }
  .stage { display: block; overflow: visible; padding: 10px 12px; }
  .stage > .pane + .pane { margin-top: 14px; }
  .raw { max-height: 62vh; max-height: 62dvh; margin: 0 auto; }
  .slotbar, .filled { margin-left: 12px; margin-right: 12px; }
  .sthumbs { flex-wrap: nowrap; overflow-x: auto; }
  .sthumb { flex: none; }
  .opts { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
  .pbar { padding: 8px 12px; gap: 8px; }
  .pbar button { min-width: 40px; min-height: 36px; }
  .pbar .scrub { flex-basis: 100%; order: -1; height: 28px; }
  .pbar .frm, .pbar .fileloop { font-size: 11px; }
  .decide { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; grid-template-columns: 1fr; gap: 8px;
    padding: 8px 12px calc(env(safe-area-inset-bottom) + 8px); box-shadow: 0 -8px 24px rgba(0,0,0,.35); }
  .decide textarea { min-height: 44px; height: 44px; font-size: 16px; padding: 10px 12px; transition: height .15s; }
  .decide textarea:focus, .decide textarea.filled { height: 96px; }
  .decide .note, .btn kbd, .btn .sub, .btn .full { display: none; }
  .btn .short { display: inline; }
  .btns { flex-direction: row; gap: 8px; }
  .btn { min-width: 0; flex: 1; min-height: 50px; justify-content: center; align-items: center; font-size: 15px; padding: 8px; border-radius: 10px; }
  .btn.approve { flex: 1.4; }
  .picks { margin: 0; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .confirm ul { flex-wrap: nowrap; overflow-x: auto; }
  .confirm .acts .btn { min-height: 48px; }
  .side { border-left: 0; border-top: 1px solid var(--line); padding: 8px 14px 24px; }

<body>
<div id="topbar"><button id="qbtn" aria-label="Open queue">☰ <span id="qcount"></span></button><b>GoodEye</b><span id="qpos"></span><button id="cardsbtn">Cards</button></div>
<div id="deck" hidden></div>
<div id="sheet" hidden></div>
<div id="undo" hidden></div>
<div id="scrim"></div>
<div class="app">
  <aside class="queue" id="queue">
    <header>
      <div class="qhead"><h1>GoodEye</h1><button class="phonebtn" id="phonebtn" title="Open this board on your phone">Phone</button></div>
      <div class="seg" id="filters"></div>
    </header>
    <div class="list" id="list"></div>
  </aside>
  <main class="main" id="main"><div class="empty">Nothing submitted yet. Loading…</div></main>
  <aside class="side" id="side"></aside>
</div>
<div class="toast" id="toast"></div>
<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const STATUS = { pending: "Needs review", changes: "Changes requested", approved: "Approved", rejected: "Rejected", picked: "Picked", not_chosen: "Not chosen", reopened: "Reopened" };
const OPEN = ["pending", "changes"], FILLED = ["approved", "picked"];
const sibsOf = it => it && it.slot ? items.filter(x => x.slot && x.slot.key === it.slot.key) : [];
const toCloseFor = it => sibsOf(it).filter(s => s.id !== it.id && [...OPEN, ...FILLED].includes(s.status));
const thumbOf = i => { const v = i.versions[i.versions.length - 1]; return v.kind === "video" ? `<video src="${fileUrl(v)}#t=1" muted preload="metadata"></video>` : `<img src="${fileUrl(v)}" loading="lazy">`; };
const inFilter = (i, f) => f === "all" || i.status === f || (f === "approved" && i.status === "picked");
const drafts = {};
const draftOf = v => drafts[v.id + "@" + v.version] ||= { ranking: [], notes: {}, cols: 3 };
const optAsset = (v, o) => ({ ...o, id: v.id, version: v.version + "#" + o.key, title: o.label, dir: v.dir, file: "options/" + o.file, project: v.project });
const FILTERS = [["pending", "Review"], ["changes", "Changes"], ["approved", "Approved"], ["all", "All"]];
const CTX = { "linkedin-banner": "LinkedIn banner", "linkedin-post": "LinkedIn post", "x-post": "X post", "x-banner": "X profile header", "instagram-post": "Instagram post",
  "instagram-story": "Instagram story", "email": "Email", "website-hero": "Website hero", "browser-tab": "Browser tab",
  "youtube-thumbnail": "YouTube thumbnail", "phone": "Phone" };
let started = false, items = [], filter = "pending", sel = { id: null, version: null, view: "asset", compare: false }, lastSig = "";

const fileUrl = v => `/files/${v.dir.split("/").map(encodeURIComponent).join("/")}/${encodeURIComponent(v.file)}`;
const item = id => items.find(i => i.id === id);
const ver = (it, version) => it.versions.find(v => v.version === version) || it.versions[it.versions.length - 1];

function media(v, { cls = "" } = {}) {
  const u = fileUrl(v), m = v.media || {};
  if (v.kind === "video") return `<video class="${cls} anim" data-fps="${m.fps || ""}" data-key="${esc(v.id + "@" + v.version)}" src="${u}" muted loop playsinline preload="auto"></video>`;
  if (v.kind === "gif") return `<canvas class="${cls} anim" data-key="${esc(v.id + "@" + v.version)}" data-src="${u}" ${m.width ? `width="${m.width}" height="${m.height}"` : ""}></canvas>`;
  return `<img class="${cls}" src="${u}" alt="${esc(v.title)}">`;
}

/* ---------- queue ---------- */
function renderQueue() {
  const counts = { all: items.length };
  FILTERS.forEach(([k]) => counts[k] = items.filter(i => inFilter(i, k)).length);
  $("#filters").innerHTML = FILTERS.map(([k, l]) => `<button class="${filter === k ? "on" : ""}" data-f="${k}">${l}<span class="n">${counts[k] || 0}</span></button>`).join("");
  const shown = items.filter(i => inFilter(i, filter));
  document.title = counts.pending ? `(${counts.pending}) GoodEye` : "GoodEye";
  $("#qcount").textContent = counts.pending || "";
  if (typeof renderDeck === "function" && isPhone() && deckMode) setTimeout(renderDeck);
  const pos = shown.findIndex(i => i.id === sel.id);
  $("#qpos").textContent = pos >= 0 ? `${pos + 1} of ${shown.length}` : "";
  const row = (i, inslot) => {
    const v = i.versions[i.versions.length - 1];
    return `<div class="row ${inslot ? "inslot" : ""} ${sel.id === i.id ? "on" : ""}" data-id="${esc(i.id)}"><div class="thumb">${thumbOf(i)}</div><div style="min-width:0">
      <div class="t">${esc(i.title)}</div>
      <div class="m"><span class="pill st-${i.status}">${STATUS[i.status]}</span><span>${v.kind === "choice" ? `Choice · ${v.options.length}` : esc(v.version)}</span>${i.project ? `<span>${esc(i.project)}</span>` : ""}</div></div></div>`;
  };
  const done = new Set(), out = [];
  shown.forEach(i => {
    if (!i.slot) return out.push(row(i, false));
    if (done.has(i.slot.key)) return;
    done.add(i.slot.key);
    const all = sibsOf(i), open = all.filter(x => OPEN.includes(x.status)).length, filled = all.find(x => FILLED.includes(x.status));
    out.push(`<div class="slothead">⧉ <b>${esc(i.slot.label)}</b> · pick one · ${filled ? "filled" : `${open} open`}</div>`);
    shown.filter(x => x.slot && x.slot.key === i.slot.key).forEach(x => out.push(row(x, true)));
  });
  $("#list").innerHTML = out.length ? out.join("") : `<div class="empty">${filter === "pending" ? "Queue is clear." : "Nothing here."}</div>`;
}
$("#filters").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  filter = b.dataset.f;
  const cur = item(sel.id);
  if (filter === "pending" && (!cur || cur.status !== "pending")) { const p = items.find(i => i.status === "pending"); return p ? select(p.id) : showIdle(); }
  renderQueue();
};
$("#list").onclick = e => { const r = e.target.closest(".row"); if (!r) return; if (isPhone()) { deckMode = false; renderDeck(); } select(r.dataset.id); };

function select(id, version) {
  const it = item(id); if (!it) return;
  const keepView = sel.id === id;
  sel = { id, version: version || it.versions[it.versions.length - 1].version, view: keepView ? sel.view : "asset", compare: keepView && sel.compare };
  history.replaceState(null, "", "#" + encodeURIComponent(id));
  document.body.classList.remove("qopen");
  if (isPhone()) window.scrollTo(0, 0);
  renderQueue(); renderMain(); renderSide();
}

/* ---------- main ---------- */
function renderMain() {
  const it = item(sel.id);
  if (!it) { if (group) { group.destroy(); group = null; } $("#main").innerHTML = idleHtml(); wireIdle(); afterRender(); return; }
  const v = ver(it, sel.version), idx = it.versions.indexOf(v), prev = it.versions[idx - 1];
  const latest = v === it.versions[it.versions.length - 1];
  const draft = $("#fb") ? $("#fb").value : "";
  if (v.kind === "choice") return renderChoice(it, v, latest, draft);
  $("#main").innerHTML = `
    <div class="head"><h2>${esc(it.title)}</h2><div class="sub">${esc(it.project ? it.project + " · " : "")}${esc(it.id)} · ${esc(v.kind)} · ${(v.size_bytes / 1048576).toFixed(1)} MB · submitted ${new Date(v.submitted_at).toLocaleString()}</div></div>
    <div class="bar"><span class="lbl">Version</span>${it.versions.map(x => `<span class="chip ${x === v ? "on" : ""}" data-v="${esc(x.version)}"><span class="pill st-${x.status}"></span>${esc(x.version)}</span>`).join("")}
      <span class="gap"></span>${prev ? `<label class="toggle"><input type="checkbox" id="cmp" ${sel.compare ? "checked" : ""}> Side by side with ${esc(prev.version)}</label>` : ""}</div>
    ${reopenHtml(it)}${slotHtml(it)}
    <div class="bar"><span class="lbl">View</span>${["asset", ...(v.contexts || []), ...(sibsOf(it).length > 1 ? ["slot"] : [])].map(c => `<span class="chip ${sel.view === c ? "on" : ""}" data-view="${esc(c)}">${c === "asset" ? "Asset" : c === "slot" ? `Compare all ${sibsOf(it).length} candidates` : "In context: " + esc(CTX[c] || c)}</span>`).join("")}</div>
    <div class="stage">${sel.view === "slot" ? slotGrid(it) : sel.compare && prev ? pane(prev, prev.version + " (previous)") + pane(v, v.version + " (this)") : pane(v, "")}</div>
    <div class="pbar" id="pbar" hidden></div>
    <div class="decide">
      <textarea id="fb" placeholder="${latest ? "Feedback for the agent. Click here and talk." : "This is an older version. Decisions go on the latest version."}" ${latest ? "" : "disabled"}>${esc(draft)}</textarea>
      <div class="btns">
        <button class="btn approve" data-d="approved" ${latest ? "" : "disabled"}><span><span class="lab">Approve</span><span class="sub">Done. No second review.</span></span><kbd>⌥A</kbd></button>
        <button class="btn changes" data-d="changes" ${latest ? "" : "disabled"}><span><span class="full">Request changes</span><span class="short">Changes</span><span class="sub">Comes back to your queue.</span></span><kbd>⌥C</kbd></button>
        <button class="btn reject" data-d="rejected" ${latest ? "" : "disabled"}>Reject <kbd>⌥R</kbd></button>
      </div>
      <div class="note">Approve with notes: the agent makes those small changes and does not send it back. Request changes: you see a new version. J / K moves through the queue.</div>
    </div>`;
  const fbEl = $("#fb"), lab = $("#main .approve .lab"), sub = $("#main .approve .sub");
  const closing = toCloseFor(it).length, extra = closing ? ` Closes ${closing} other${closing > 1 ? "s" : ""}.` : "";
  const syncLabel = () => { const n = fbEl.value.trim(); lab.textContent = n ? "Approve with notes" : "Approve"; sub.textContent = (n ? "Agent applies notes. No second review." : "Done. No second review.") + extra; };
  fbEl.oninput = syncLabel; syncLabel();
  $("#main").querySelectorAll("[data-v]").forEach(c => c.onclick = () => { sel.version = c.dataset.v; renderMain(); renderSide(); });
  $("#main").querySelectorAll("[data-view]").forEach(c => c.onclick = () => { sel.view = c.dataset.view; renderMain(); });
  $("#main").querySelectorAll("[data-d]").forEach(b => b.onclick = () => decide(b.dataset.d));
  const cmp = $("#cmp"); if (cmp) cmp.onchange = () => { sel.compare = cmp.checked; renderMain(); };
  wireSlot(it);
  wireReopen(it);
  mountPlayers(it);
  afterRender();
}

function reopenHtml(it) {
  return ["rejected", "not_chosen"].includes(it.status) ? `<div class="filled">${STATUS[it.status]}. Changed your mind?<button data-reopen>Reopen for review</button></div>` : "";
}
function wireReopen(it) {
  const b = $("#main [data-reopen]"); if (!b) return;
  b.onclick = async () => {
    const v = it.versions[it.versions.length - 1];
    const res = await fetch("/api/decide", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: it.id, version: v.version, verdict: "reopened", feedback: "" }) });
    if (!res.ok) { haptic("error"); return toast((await res.json()).error || "Save failed"); }
    haptic("undo"); toast(`Reopened ${it.title}. The agent was told.`); await load(true); select(it.id);
  };
}
function slotHtml(it) {
  const sibs = sibsOf(it);
  if (sibs.length < 2) return "";
  const filler = sibs.find(s => s.id !== it.id && FILLED.includes(s.status));
  const strip = `<div class="slotbar"><div class="info"><b>One slot: ${esc(it.slot.label)}</b><br>${sibs.length} candidates. Approving one closes the others as not chosen.</div>
    <div class="sthumbs">${sibs.map(s => `<div class="sthumb ${s.id === it.id ? "on" : ""} ${["rejected", "not_chosen"].includes(s.status) ? "closed" : ""}" data-go="${esc(s.id)}" title="${esc(s.title)}">${thumbOf(s)}<span class="pill st-${s.status}">${STATUS[s.status]}</span></div>`).join("")}</div></div>`;
  const banner = filler && OPEN.includes(it.status) ? `<div class="filled">Slot already filled by <a data-go="${esc(filler.id)}">${esc(filler.title)}</a> (${STATUS[filler.status]}). Approving this one replaces it.<button data-close-slot>Close this as not chosen</button></div>` : "";
  return strip + banner;
}
function wireSlot(it) {
  $("#main").querySelectorAll("[data-go]").forEach(g => g.onclick = () => { const view = sel.view; select(g.dataset.go); if (view === "slot") { sel.view = "slot"; renderMain(); } });
  const c = $("#main [data-close-slot]");
  if (c) c.onclick = async () => {
    const v = it.versions[it.versions.length - 1];
    const res = await fetch("/api/decide", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: it.id, version: v.version, verdict: "not_chosen", feedback: "" }) });
    if (!res.ok) return toast("Save failed");

/* ---------- players: one timeline bar drives every GIF/video on the stage (both versions when side by side) ---------- */
const gifCache = new Map();
function decodeGif(url) {
  if (!gifCache.has(url)) gifCache.set(url, (async () => {
    const buf = await (await fetch(url)).arrayBuffer();
    if (!("ImageDecoder" in window)) return null;
    const dec = new ImageDecoder({ data: buf, type: "image/gif" });
    await dec.completed; await dec.tracks.ready;
    const track = dec.tracks.selectedTrack, frames = [];
    let start = 0;
    for (let i = 0; i < track.frameCount; i++) {
      const { image } = await dec.decode({ frameIndex: i });
      let d = (image.duration || 0) / 1e6;
      if (d < 0.02) d = 0.1; // browsers show 0 and 10 ms GIF delays as 100 ms
      frames.push({ bmp: await createImageBitmap(image), start, dur: d, w: image.displayWidth, h: image.displayHeight });
      start += d; image.close();
    }
    dec.close();
    return { frames, total: start, fileLoops: track.repetitionCount === Infinity ? "forever" : track.repetitionCount === 0 ? "once" : `${track.repetitionCount + 1} times` };
  })());
  return gifCache.get(url);
}

class GifPlayer {
  constructor(el) { this.el = el; this.t = 0; this.loop = true; this.playing = false; this.data = null;
    this.ready = decodeGif(el.dataset.src).then(d => {
      if (!d) { const img = document.createElement("img"); img.src = el.dataset.src; img.className = el.className; el.replaceWith(img); this.el = img; return; }
      this.data = d; el.width = d.frames[0].w; el.height = d.frames[0].h; this.draw();
    }); }
  get dur() { return this.data ? this.data.total : 0; }
  get time() { return this.t; }
  get frameCount() { return this.data ? this.data.frames.length : 0; }
  frameAt(t) { const f = this.data.frames; let lo = 0, hi = f.length - 1; while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (f[mid].start <= t + 1e-6) lo = mid; else hi = mid - 1; } return lo; }
  get frame() { return this.data ? this.frameAt(this.t) : 0; }
  draw() { if (!this.data) return; const ctx = this.el.getContext("2d"); ctx.clearRect(0, 0, this.el.width, this.el.height); ctx.drawImage(this.data.frames[this.frameAt(this.t)].bmp, 0, 0); }
  seek(t) { if (!this.data) return; this.t = Math.max(0, Math.min(t, this.dur - 1e-4)); this.draw(); }

function deltaTable(it, v, prev, groups) {

/* ---------- decisions ---------- */
let confirming = null;
function askConfirm(it, verdict, closing) {
  confirming = verdict;

  dec.insertAdjacentHTML("afterbegin", `<div class="confirm"><div class="q">Approve <b>${esc(it.title)}</b> for <b>${esc(it.slot.label)}</b>?</div>
    <div style="font-size:12px;color:var(--text-secondary)">This closes ${closing.length} other candidate${closing.length > 1 ? "s" : ""} as not chosen. The agent stops work on ${closing.length > 1 ? "them" : "it"}.</div>
    <ul>${closing.map(s => `<li>${thumbOf(s)}${esc(s.title)}<br>${STATUS[s.status]}</li>`).join("")}</ul>
    <div class="acts"><button class="btn approve" data-confirm>Approve and close ${closing.length} <kbd>⌥A</kbd></button><button class="plain" data-cancel>Cancel (Esc)</button></div></div>`);

async function decide(verdict, confirmed) {
  const it = item(sel.id); if (!it) return;
  const v = it.versions[it.versions.length - 1], fb = $("#fb").value;
  if (FILLED.includes(verdict) && !confirmed) {
    const closing = toCloseFor(it);
    if (closing.length) { if (confirming) return decide(verdict, true); return askConfirm(it, verdict, closing); }
  }
  confirming = null;
  const body = { id: it.id, version: v.version, verdict, feedback: fb };
  let notes = false;
  if (v.kind === "choice") {
    const d = draftOf(v);
    body.ranking = d.ranking.map(k => ({ key: k, note: d.notes[k] || "" }));
    body.option_notes = Object.entries(d.notes).filter(([k, n]) => n.trim() && !d.ranking.includes(k)).map(([key, note]) => ({ key, note }));
    notes = Object.values(d.notes).some(n => n.trim());
    if (verdict === "picked" && !d.ranking.length) { toast("Pick at least one option."); return; }
  }
  if (verdict === "changes" && !fb.trim() && !notes) { toast("Say what to change first."); $("#fb").focus(); return; }
  const res = await fetch("/api/decide", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!res.ok) { toast((await res.json()).error || "Save failed"); return; }
  delete drafts[v.id + "@" + v.version];
  haptic(verdict === "rejected" ? "reject" : verdict === "changes" ? "changes" : "approve");
  $("#fb").value = "";
  const saved = await res.json();
  toast(`${STATUS[verdict]}: ${it.title} ${v.version}.${(saved.closed || []).length ? ` Closed ${saved.closed.length} other candidate${saved.closed.length > 1 ? "s" : ""}.` : ""} Sent to the agent.`);
  await load(true);

document.addEventListener("keydown", e => {

    const d = { KeyA: isChoice ? "picked" : "approved", KeyC: "changes", KeyR: "rejected" }[e.code];

  }

  if (e.target.tagName === "TEXTAREA" || e.metaKey || e.ctrlKey) return;
  if (/^[1-9]$/.test(e.key) && !/INPUT|BUTTON/.test(e.target.tagName)) {
    const cur = item(sel.id), v = cur && ver(cur, sel.version);
    if (v && v.kind === "choice" && v === cur.versions[cur.versions.length - 1] && v.options[+e.key - 1]) { toggleRank(v, v.options[+e.key - 1].key); return; }

/* ---------- data ---------- */
async function load(force) {

  items = data; lastSig = sig;
  renderQueue();
  const it = item(sel.id);
  if (!it) {
    const want = force && !started ? item(decodeURIComponent(location.hash.slice(1))) : null;
    const pending = items.find(i => i.status === "pending");
    if (want) select(want.id);
    else if (pending) { select(pending.id); if (started) toast(`New for review: ${pending.title}`); }
    else { renderMain(); renderSide(); }
    started = true;
    return;

  fitMockups();
  const fb = $("#fb");
  if (fb) { const sync = () => fb.classList.toggle("filled", !!fb.value.trim()); fb.addEventListener("input", sync); sync(); }
  const dec = $(".decide");
  document.body.style.setProperty("--dh", (dec ? dec.offsetHeight : 0) + "px");
}
addEventListener("resize", () => { afterRender(); deckTop = null; renderDeck(); });
$("#qbtn").onclick = () => document.body.classList.add("qopen");
$("#scrim").onclick = () => document.body.classList.remove("qopen");

// Swipe left or right on the asset to move through the queue.
let touch = null;
document.addEventListener("touchstart", e => {
  const t = e.target;
  if (!isPhone() || deckMode || !t.closest(".stage") || t.closest("input, textarea, button, .pbar")) { touch = null; return; }
  touch = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() };
}, { passive: true });
document.addEventListener("touchend", e => {
  if (!touch) return;
  const dx = e.changedTouches[0].clientX - touch.x, dy = e.changedTouches[0].clientY - touch.y, dt = Date.now() - touch.t;
  touch = null;
  if (Math.abs(dx) < 70 || Math.abs(dy) > Math.abs(dx) * 0.6 || dt > 700) return;
  const shown = items.filter(i => inFilter(i, filter)), i = shown.findIndex(x => x.id === sel.id);
  const n = shown[i + (dx < 0 ? 1 : -1)];
  if (n) select(n.id); else toast(dx < 0 ? "End of the queue" : "Start of the queue");
}, { passive: true });

// Desktop: show the QR code that opens this board on a phone.
$("#phonebtn").onclick = async () => {
  const m = document.createElement("div"); m.className = "modal";
  let html;
  try {
    const p = await (await fetch("/api/pair")).json();
    html = p.lan && p.urls.length ? `<h3 style="margin-top:0">Scan with your phone</h3>${p.urls[0].svg}<div class="url">${esc(p.urls[0].url)}</div>
      <p style="font-size:13px;color:var(--text-secondary)">Same Wi-Fi as this computer. The link signs the phone in once. Keep it private.${p.urls.length > 1 ? `<br>${esc(p.urls[1].label)}: ${esc(p.urls[1].url)}` : ""}</p>`
      : `<h3 style="margin-top:0">Phone mode is off</h3><p style="color:var(--text-secondary)">Run <code>goodeye phone</code> in a terminal on this computer, then click Phone again.</p>`;
  } catch (e) { html = `<p>Could not reach the board.</p>`; }
  m.innerHTML = `<div class="box">${html}<button class="phonebtn" style="display:inline-block;margin-top:10px;padding:8px 16px">Close</button></div>`;
  m.onclick = e => { if (e.target === m || e.target.tagName === "BUTTON") m.remove(); };
  document.body.appendChild(m);
};

// Poll for new work only while the page is visible. The server answers 304 when nothing changed.
let poll = null;
const startPoll = () => { if (!poll) poll = setInterval(() => load(false).catch(() => {}), 3000); };
const stopPoll = () => { clearInterval(poll); poll = null; };
document.addEventListener("visibilitychange", () => { if (document.hidden) stopPoll(); else { load(false).catch(() => {}); startPoll(); } });
addEventListener("hashchange", () => { const id = decodeURIComponent(location.hash.slice(1)); if (id && id !== sel.id && item(id)) select(id); });
load(true);
startPoll();
</script>
</body>
</html>
